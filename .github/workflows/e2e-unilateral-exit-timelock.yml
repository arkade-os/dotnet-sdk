name: E2E Unilateral Exit (time-based delay)

# The default regtest config sets ARKD_UNILATERAL_EXIT_DELAY=5, which is a
# BIP-68 *block* count. arkd's production default is 86400 (24 h), which is a
# *time*-based relative lock — a different encoding (512-second units, bit 22
# set) and a different maturity rule (median time past, not block height).
# Nothing in the block-based suite touches that path, so it gets its own
# regtest with a >= 512 delay.
#
# arkd refuses to start unless every delay is the same locktime type, so all
# five have to cross 512 together — raising only the unilateral pair leaves it
# seconds-typed among block-typed neighbours and arkd exits with "unilateral
# exit delay and vtxo tree expiry type mismatch" before it ever serves. Values
# are multiples of 512 (BIP-68 granularity; arkd rounds down otherwise), with
# boarding kept distinct from unilateral because arkd requires that too.

on:
  workflow_call:

jobs:
  test:
    name: E2E Unilateral Exit Tests (time-based delay)
    runs-on: ubuntu-latest
    env:
      ARKD_UNILATERAL_EXIT_DELAY: 1024
      ARKD_PUBLIC_UNILATERAL_EXIT_DELAY: 1024
      ARKD_VTXO_TREE_EXPIRY: 8192
      ARKD_BOARDING_EXIT_DELAY: 2048
      ARKD_CHECKPOINT_EXIT_DELAY: 1536
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/e2e-setup
      - name: Run time-based unilateral exit E2E tests
        run: dotnet test NArk.Tests.End2End --no-build --verbosity normal --filter "TestCategory=UnilateralExitTimeBased"
        timeout-minutes: 20
      - name: Collect docker logs on failure
        if: failure()
        run: |
          docker logs arkd > /tmp/arkd-logs.txt 2>&1 || true
          docker logs bitcoin > /tmp/bitcoin-logs.txt 2>&1 || true
          docker logs lnd > /tmp/lnd-logs.txt 2>&1 || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-unilateral-exit-timelock
          path: /tmp/*-logs.txt
      - name: Stop infrastructure
        if: always()
        run: node regtest/regtest.mjs clean || true
