name: E2E Covclaim

on:
  workflow_call:

# Non-interactive claims need a pairing that no other suite can run on:
#   - fulmine v0.4.0-rc.4 is what actually builds the claim leaf, but it drops the
#     fulmine.v1.DelegateService gRPC API the delegate e2e tests depend on
#   - Boltz must be a build carrying BoltzExchange/boltz-backend#1467, and it has to
#     match fulmine's major version or it returns an empty claimDetails.serverPublicKey
# Process env wins over .env.regtest, so scoping the overrides to this job keeps every
# other workflow on the released images.
#
# All three images are previews from unmerged work (boltz-backend#1467, ts-sdk#613) and
# altaf4n/boltz is a fork build — expect this to need repinning once they land.
# Digest-pinned, not tag-pinned. Two of these are moving targets — a fork build and an
# RC — and a tag that gets re-pushed would silently swap the binary under CI without any
# change here to show for it. Repin (and prefer released tags) once the upstream PRs land.
env:
  # ghcr.io/arklabshq/fulmine:v0.4.0-rc.4
  FULMINE_IMAGE: ghcr.io/arklabshq/fulmine@sha256:0e07bb6e4d99e43f6d03d9eded00bc25984b0731fb6e9cbd7fd31423d926c210
  # altaf4n/boltz:fulmine-v4-support — fork build of BoltzExchange/boltz-backend#1467
  BOLTZ_IMAGE: altaf4n/boltz@sha256:0083b3aaf76162b9320c2045579d1335ab74243aff372423a638297e52394e7f
  # ghcr.io/arkade-os/covclaimd:v0.0.1-rc.2
  COVCLAIMD_IMAGE: ghcr.io/arkade-os/covclaimd@sha256:e2b7d76a5c6dadbed8fb789ef09993da1e0c5e68435c852f5bf0ff403c1fab2d
  # arkd reads locktimes by magnitude — under the BIP68 boundary of 512 they are blocks.
  # A swap e2e run mines more than the default 180 on its own, expiring VTXOs mid-run,
  # and the auto-miner would keep advancing the tip between tests.
  ARKD_VTXO_TREE_EXPIRY: '511'
  AUTOMINE_INTERVAL: '0'

jobs:
  test:
    name: E2E Covclaim Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      # The regtest harness is version-coupled to fulmine, not just configured for it:
      # v0.4 returns a `mnemonic` from /wallet/genseed where v0.3 returned an `nsec`, and
      # the committed submodule's setup script only speaks v0.3 ("failed to generate
      # seed" otherwise). So overriding FULMINE_IMAGE alone is not enough — this job
      # needs the branch whose harness matches.
      #
      # It cannot be the repo-wide pin either: fulmine v0.4 drops the
      # fulmine.v1.DelegateService gRPC API that the delegate e2e tests call. Until
      # upstream regtest supports both, one job moves and the rest stay put.
      - name: Point regtest at the fulmine v4 harness
        run: |
          git -C regtest fetch --depth 1 origin bump-fulmine
          git -C regtest checkout FETCH_HEAD
          git -C regtest log --oneline -1
      - uses: ./.github/actions/e2e-setup
        with:
          # covclaimd pulls in ark + emulator; regtest.mjs skips the profile entirely
          # when COVCLAIMD_IMAGE is empty, which is why it is set above.
          profile: boltz,covclaimd
      - name: Run covclaim E2E tests
        run: dotnet test NArk.Tests.End2End --no-build --verbosity normal --filter "TestCategory=Covclaim"
        timeout-minutes: 20
      - name: Collect docker logs on failure
        if: failure()
        run: |
          docker logs arkd > /tmp/arkd-logs.txt 2>&1 || true
          docker logs boltz > /tmp/boltz-logs.txt 2>&1 || true
          docker logs boltz-fulmine > /tmp/fulmine-logs.txt 2>&1 || true
          docker logs covclaimd > /tmp/covclaimd-logs.txt 2>&1 || true
          docker logs emulator > /tmp/emulator-logs.txt 2>&1 || true
          docker logs bitcoin > /tmp/bitcoin-logs.txt 2>&1 || true
          docker logs lnd > /tmp/lnd-logs.txt 2>&1 || true
          docker logs boltz-lnd > /tmp/boltz-lnd-logs.txt 2>&1 || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-covclaim
          path: /tmp/*-logs.txt
      - name: Stop infrastructure
        if: always()
        run: node regtest/regtest.mjs clean || true
