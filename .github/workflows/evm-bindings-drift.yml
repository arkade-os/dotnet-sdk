name: EVM Bindings Drift Check

on:
  pull_request:

jobs:
  boltz-core-sync:
    name: Check vendored boltz-core contracts match master
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contracts from boltz-core master
        run: |
          FILES="ERC20Swap.sol TransferHelper.sol EtherSwap.sol Router.sol interfaces/OFT.sol interfaces/ITokenMessengerV2.sol"
          for f in $FILES; do
            mkdir -p "/tmp/boltz-core/$(dirname "$f")"
            wget -q \
              "https://raw.githubusercontent.com/BoltzExchange/boltz-core/master/contracts/${f}" \
              -O "/tmp/boltz-core/${f}"
          done

      - name: Diff against vendored contract source
        run: |
          SOL_DIR="NArk.Swaps.Evm/Contracts/Sol"
          FILES="ERC20Swap.sol TransferHelper.sol EtherSwap.sol Router.sol interfaces/OFT.sol interfaces/ITokenMessengerV2.sol"
          failed=0
          for f in $FILES; do
            if ! diff -u "/tmp/boltz-core/${f}" "${SOL_DIR}/${f}"; then
              echo "::error file=${SOL_DIR}/${f}::${f} is out of sync with boltz-core master"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            echo ""
            echo "${SOL_DIR} is out of sync with BoltzExchange/boltz-core master."
            echo "Pull the updated file(s), re-run NArk.Swaps.Evm/generate-bindings.sh, and"
            echo "review/commit the resulting diff in NArk.Swaps.Evm/Contracts/Generated/."
            exit 1
          fi
          echo "All vendored boltz-core contracts are in sync with master."

  external-deps-sync:
    name: Check vendored permit2/OpenZeppelin leaves match upstream
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch leaf interfaces from upstream
        run: |
          mkdir -p /tmp/ext/permit2/interfaces
          for f in ISignatureTransfer.sol IEIP712.sol; do
            wget -q "https://raw.githubusercontent.com/Uniswap/permit2/main/src/interfaces/${f}" \
              -O "/tmp/ext/permit2/interfaces/${f}"
          done

          OZ_FILES="token/ERC20/IERC20.sol token/ERC20/utils/SafeERC20.sol token/ERC20/extensions/IERC20Metadata.sol interfaces/IERC1363.sol interfaces/IERC20Metadata.sol interfaces/IERC20.sol interfaces/IERC165.sol utils/ReentrancyGuard.sol utils/StorageSlot.sol utils/introspection/IERC165.sol"
          for f in $OZ_FILES; do
            mkdir -p "/tmp/ext/@openzeppelin/contracts/$(dirname "$f")"
            wget -q "https://raw.githubusercontent.com/OpenZeppelin/openzeppelin-contracts/master/contracts/${f}" \
              -O "/tmp/ext/@openzeppelin/contracts/${f}"
          done

      - name: Diff against vendored copies
        run: |
          SOL_DIR="NArk.Swaps.Evm/Contracts/Sol"
          FILES="permit2/interfaces/ISignatureTransfer.sol permit2/interfaces/IEIP712.sol @openzeppelin/contracts/token/ERC20/IERC20.sol @openzeppelin/contracts/token/ERC20/utils/SafeERC20.sol @openzeppelin/contracts/token/ERC20/extensions/IERC20Metadata.sol @openzeppelin/contracts/interfaces/IERC1363.sol @openzeppelin/contracts/interfaces/IERC20Metadata.sol @openzeppelin/contracts/interfaces/IERC20.sol @openzeppelin/contracts/interfaces/IERC165.sol @openzeppelin/contracts/utils/ReentrancyGuard.sol @openzeppelin/contracts/utils/StorageSlot.sol @openzeppelin/contracts/utils/introspection/IERC165.sol"
          failed=0
          for f in $FILES; do
            if ! diff -u "/tmp/ext/${f}" "${SOL_DIR}/${f}"; then
              echo "::error file=${SOL_DIR}/${f}::${f} is out of sync with upstream"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            echo ""
            echo "${SOL_DIR} permit2/OpenZeppelin leaves are out of sync with upstream."
            echo "Pull the updated file(s), re-run NArk.Swaps.Evm/generate-bindings.sh, and"
            echo "review/commit the resulting diff in NArk.Swaps.Evm/Contracts/Generated/Router/."
            exit 1
          fi
          echo "All vendored permit2/OpenZeppelin leaves are in sync with upstream."
